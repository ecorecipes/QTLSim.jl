name: CI
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'   # Mondays: everything, and the slow vignettes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.10', '1']
        os: [ubuntu-latest]
        include:
          - version: '1'
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  vignette-sync:
    name: Vignette sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - run: julia scripts/sync_vignettes.jl --check
  vignettes:
    # Runs the vignettes' code (not Quarto) in the vignettes' environment, whose
    # Manifest is committed (Julia 1.12). These need neither QTSim, SLiM nor the
    # paper's data; 04, the slowest (about 6 minutes on three threads locally), runs
    # in vignettes-slow. 12 takes about 2 minutes on three threads, 13 about 1.5 minutes.
    name: Vignettes (code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install the vignettes' environment
        run: julia --project=vignettes -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run vignettes 01-03, 05, 06, 10, 12 and 13
        run: julia -t auto --project=vignettes scripts/run_vignettes.jl 01 02 03 05 06 10 12 13
  vignettes-slow:
    name: Vignettes (code, slow)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2
      - name: Install the vignettes' environment
        run: julia --project=vignettes -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run vignette 04
        run: julia -t auto --project=vignettes scripts/run_vignettes.jl 04
  qtsim:
    name: QTSim parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Check and build the bundled QTSim source
        run: make -C reference/QTSim check && make -C reference/QTSim
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Bit for bit (GSL-locked replica)
        run: julia --project=. validate/gsl_locked.jl
      - name: In distribution (Julia kernel vs QTSim)
        run: julia --project=. validate/compare_to_qtsim.jl
  symbolic:
    name: Symbolic checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Instantiate validate/symbolic
        run: julia --project=validate/symbolic -e 'using Pkg; Pkg.instantiate()'
      # closures, spectrum, several traits, F_ST, demography: about 1 min locally once compiled
      - name: Symbolic checks of the theory (Symbolics.jl) and spot checks against the code
        run: julia --project=validate/symbolic validate/symbolic/check_all.jl
  slim:
    name: SLiM backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache SLiM 5.2
        id: cache-slim
        uses: actions/cache@v4
        with:
          path: ~/slim-bin
          key: slim-v5.2-${{ runner.os }}
      - name: Build SLiM 5.2
        if: steps.cache-slim.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v5.2 https://github.com/MesserLab/SLiM.git "$HOME/SLiM-src"
          cmake -S "$HOME/SLiM-src" -B "$HOME/SLiM-src/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$HOME/SLiM-src/build" --target slim -j4
          mkdir -p "$HOME/slim-bin" && cp "$HOME/SLiM-src/build/slim" "$HOME/slim-bin/"
      - run: |
          echo "SLIM=$HOME/slim-bin/slim" >> "$GITHUB_ENV"
          "$HOME/slim-bin/slim" -v
      - name: Install GSL
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev
      - name: Build the bundled QTSim source
        run: make -C reference/QTSim check && make -C reference/QTSim
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install the validation environment
        run: julia --project=validate/slim -e 'using Pkg; Pkg.instantiate()'
      - name: Generated SLiM model vs the hand-written port, run for run
        run: julia --project=validate/slim validate/slim/check_generated.jl
      - name: Generated SLiM model vs QTSim, in distribution
        run: julia -t auto --project=validate/slim validate/slim/compare_to_qtsim.jl
      # 10 runs per backend and scenario (about 2300 CPU-seconds): with so few runs a KS
      # p below 0.001 needs almost complete separation, so this catches gross breakage;
      # the weekly run uses the script's default, 40.
      - name: Density regulation, generated SLiM model vs the kernel, in distribution (10 runs)
        if: github.event_name != 'schedule'
        run: julia -t auto --project=validate/slim validate/slim/compare_demography.jl 10
      - name: Density regulation, generated SLiM model vs the kernel, in distribution (40 runs)
        if: github.event_name == 'schedule'
        run: julia -t auto --project=validate/slim validate/slim/compare_demography.jl 40
      # Fecundity selection: 40 runs take about 80 CPU-minutes, so on push 8 runs per backend
      # and scenario (about 16 CPU-minutes), again only a gross-breakage check; 40 weekly.
      - name: Fecundity selection, generated SLiM model vs the kernel, in distribution (8 runs)
        if: github.event_name != 'schedule'
        run: julia -t auto --project=validate/slim validate/slim/compare_selection.jl 8
      - name: Fecundity selection, generated SLiM model vs the kernel, in distribution (40 runs)
        if: github.event_name == 'schedule'
        run: julia -t auto --project=validate/slim validate/slim/compare_selection.jl 40
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: julia --project=docs docs/make.jl
